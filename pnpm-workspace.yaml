catalogMode: prefer
ignoreWorkspaceRootCheck: true
shellEmulator: true
trustPolicy: no-downgrade

catalogs:
  cli:
    bumpp: ^11.0.1
    publint: ^0.3.18
    tsdown: ^0.21.10
    tsx: ^4.21.0
  lint:
    lint-staged: ^17.0.0
    oxfmt: ^0.48.0
    oxlint: ^1.63.0
    oxlint-tsgolint: ^0.22.1
    simple-git-hooks: ^2.13.1
  testing:
    vitest: ^4.1.5
  types:
    '@types/node': ^25.6.0
    '@typescript/native-preview': 7.0.0-dev.20260506.1
    typescript: ^6.0.3

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
